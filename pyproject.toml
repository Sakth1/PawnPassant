[project]
name = "pawnpassant"
version = "v0.4.4"
description = "A cross-platform chess game with full rules enforcement, chess clock, and Leela Chess Zero AI, built with Flet."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sakth1" }
]
dependencies = [
    "flet>=0.86.2",
    "chess>=1.11.2",
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.2",
    "flet-desktop>=0.86.2",
    "flet-web>=0.86.2",
    "pytest>=9.0.3",
]

[tool.flet]
org = "com.mycompany"
product = "Pawn Passant"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
source_packages = ["chess"]

[tool.flet.android]
permissions = ["android.permission.INTERNET"]
split_per_abi = true
compile_packages = true
# Extract native .so files to ANDROID_NATIVE_LIBRARY_DIR at install time.
# Required: the bundled Stockfish PIE binary (libstockfish.so) must have a
# real executable filesystem path — with modern (mmap) packaging there is
# no .so on disk, and Android 10+ refuses to execute anything else.
legacy_packaging = true
dependencies = [
    "chess>=1.11.2",
]

[tool.flet.app]
path = "src"

[tool.pawnpassant.release]
binary_name = "Pawn-Passant"

# ── Android engine setup ─────────────────────────────────────────────
# Stockfish is self-built as PIE and injected into the APKs' lib/<abi>/
# after `flet build apk` (wheels can't go through pip: serious_python
# targets one ABI, so any sibling-arch wheel hard-fails the build).
# See docs/android-stockfish.md. CI flow:
#   scripts/build_stockfish_android_pie.py  -> dist/stockfish-android/<abi>/
#   scripts/package_android_engine.py       -> dist/wheels/*.whl (kept for a
#                                              future PyPI publishing path)
#   scripts/inject_android_engine.py        -> lib/<abi>/libstockfish.so
#                                              into every built APK pre-sign
# (scripts/fetch_stockfish_android.py + prepare_android_engine.py describe the
# old assets-based flow, which cannot work on Android 10+: upstream binaries
# are non-PIE and asset copies land in non-executable storage.)

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "N"]  # errors, pyflakes, naming

# Optional but useful
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
