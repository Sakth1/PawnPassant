[project]
name = "pawnpassant"
version = "v0.4.4"
description = "A cross-platform chess game with full rules enforcement, chess clock, and Leela Chess Zero AI, built with Flet."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sakth1" }
]
dependencies = [
    "flet>=0.86.2",
    "chess>=1.11.2",
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.2",
    "flet-desktop>=0.86.2",
    "flet-web>=0.86.2",
    "pytest>=9.0.3",
]

[tool.flet]
org = "com.mycompany"
product = "Pawn Passant"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
source_packages = ["chess"]

[tool.flet.android]
permissions = ["android.permission.INTERNET"]
split_per_abi = true
compile_packages = true
# Extract native .so files to ANDROID_NATIVE_LIBRARY_DIR at install time.
# Required: the bundled Stockfish PIE binary (libstockfish.so) must have a
# real executable filesystem path — with modern (mmap) packaging there is
# no .so on disk, and Android 10+ refuses to execute anything else.
legacy_packaging = true
dependencies = [
    "chess>=1.11.2",
    # Self-built PIE Stockfish, one wheel per ABI (see below). Pinned in
    # lockstep with ENGINE_WHEEL_VERSION in release-build.yml.
    "pawnpassant-stockfish-android-arm64==19.0.0",
    "pawnpassant-stockfish-android-armv7==19.0.0",
]

# Local wheel overrides for `flet build`: serious_python installs these
# targeting the Android platform (host pip would reject their
# android_* tags, so never pip-install them directly). Paths resolve
# against the project root; CI downloads the wheels artifact to dist/.
[tool.flet.android.dev_packages]
"pawnpassant-stockfish-android-arm64" = "dist/wheels/pawnpassant_stockfish_android_arm64-19.0.0-py3-none-android_24_arm64_v8a.whl"
"pawnpassant-stockfish-android-armv7" = "dist/wheels/pawnpassant_stockfish_android_armv7-19.0.0-py3-none-android_24_armeabi_v7a.whl"

[tool.flet.app]
path = "src"

[tool.pawnpassant.release]
binary_name = "Pawn-Passant"

# ── Android engine setup ─────────────────────────────────────────────
# Stockfish is self-built as PIE and bundled per ABI as a native library.
# See docs/android-stockfish.md. CI flow:
#   scripts/build_stockfish_android_pie.py  -> dist/stockfish-android/<abi>/
#   scripts/package_android_engine.py       -> dist/wheels/*.whl (consumed by
#                                              `flet build apk` via
#                                              [tool.flet.android.dev_packages])
# (scripts/fetch_stockfish_android.py + prepare_android_engine.py describe the
# old assets-based flow, which cannot work on Android 10+: upstream binaries
# are non-PIE and asset copies land in non-executable storage.)

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "N"]  # errors, pyflakes, naming

# Optional but useful
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
